services:
  - type: web
    name: volmind-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_PAPER_TRADE
        value: "true"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FEATHERLESS_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: VOLMIND_MAX_POSITION_RISK
        value: "500"
      - key: VOLMIND_MAX_DAILY_LOSS
        value: "1500"
      - key: VOLMIND_MIN_DIVERGENCE
        value: "0.10"
      - key: VOLMIND_MIN_CONFIDENCE
        value: "0.55"
      - key: VOLMIND_MAX_OPEN_TRADES
        value: "3"
      - key: VOLMIND_TAKE_PROFIT_PCT
        value: "0.50"
      - key: VOLMIND_STOP_LOSS_PCT
        value: "0.50"
      - key: VOLMIND_MIN_DAYS_TO_EXPIRY_EXIT
        value: "1"
      - key: VOLMIND_AUTONOMOUS_MODE
        value: "false"
      - key: VOLMIND_WATCHLIST
        value: AAPL,MSFT,NVDA,SPY
      - key: VOLMIND_SCAN_INTERVAL_MINUTES
        value: "30"
      - key: VOLMIND_MONITOR_INTERVAL_MINUTES
        value: "5"
